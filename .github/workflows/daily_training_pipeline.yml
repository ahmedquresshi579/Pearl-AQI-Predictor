name: Daily Training Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # once a day at 2 AM UTC
  workflow_dispatch:

jobs:
  train-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install scikit-learn pandas numpy python-dotenv "hopsworks[python]"

      - name: Train model
        working-directory: training_pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python train_model.py

      - name: Register model to Hopsworks
        working-directory: training_pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python register_model.py